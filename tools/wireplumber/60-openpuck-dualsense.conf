# OpenPuck / DualSense 4-channel audio-haptics configuration for PipeWire / WirePlumber.
# Configures the USB Audio interface as a 4.0 Analog Surround sink (FL/FR Audio, RL/RR Haptics)
# and disables UCM profile overrides that split or mute the rear haptic channels.

monitor.alsa.rules = [
  {
    matches = [
      {
        "device.name" = "~alsa_card.*Sony_Interactive_Entertainment*"
      },
      {
        "device.name" = "~alsa_card.*DualSense*"
      },
      {
        "device.name" = "~alsa_card.*Wireless_Controller*"
      }
    ],
    actions = {
      update-props = {
        "api.alsa.use-ucm" = false,
        "device.profile-set" = "default.conf",
        "device.profile" = "analog-surround-40",
        "device.description" = "Wireless Controller",
        "device.nick" = "Wireless Controller",
        "device.routes.default-sink-volume" = "1.0"
      }
    }
  },
  {
    matches = [
      {
        "node.name" = "~alsa_output.*Sony_Interactive_Entertainment.*"
      },
      {
        "node.name" = "~alsa_output.*DualSense.*"
      },
      {
        "node.name" = "~alsa_output.*Wireless_Controller.*"
      }
    ],
    actions = {
      update-props = {
        "node.description" = "Wireless Controller",
        "node.nick" = "Wireless Controller",
        "audio.position" = [ "FL", "FR", "RL", "RR" ]
      }
    }
  },
  {
    matches = [
      {
        "node.name" = "~.*wine.*",
        "audio.channels" = 4,
        "audio.position" = [ "FL", "FR", "RL", "RR" ]
      },
      {
        "application.process.binary" = "~.*\\.exe",
        "audio.channels" = 4,
        "audio.position" = [ "FL", "FR", "RL", "RR" ]
      }
    ],
    actions = {
      update-props = {
        "target.node" = "~alsa_output.*Wireless_Controller.*"
      }
    }
  }
]

