# OpenPuck / DualSense 4-channel audio-haptics configuration for PipeWire / WirePlumber.
# Configures the USB Audio interface as a 4.0 Analog Surround sink (FL/FR Audio, RL/RR Haptics)
# and disables UCM profile overrides that split or mute the rear haptic channels.

monitor.alsa.rules = [
  {
    matches = [
      {
        "device.name" = "~alsa_card.*Sony_Interactive_Entertainment*"
      },
      {
        "device.name" = "~alsa_card.*DualSense*"
      },
      {
        "device.name" = "~alsa_card.*Wireless_Controller*"
      }
    ],
    actions = {
      update-props = {
        "api.alsa.use-ucm" = false,
        "device.profile" = "analog-surround-40"
      }
    }
  }
]
