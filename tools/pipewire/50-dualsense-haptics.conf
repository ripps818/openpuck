# PipeWire-Pulse rule to automatically route any 4-channel haptic audio stream
# directly to the OpenPuck / DualSense "Wireless Controller" 4.0 Surround sink.

pulse.rules = [
  {
    matches = [
      {
        # Match any 4-channel stream created by Proton / Wine / native games
        "audio.channels" = 4
      }
    ]
    actions = {
      update-props = {
        "target.object" = "alsa_output.dualsense_wireless_controller.analog-surround-40"
      }
    }
  }
]
